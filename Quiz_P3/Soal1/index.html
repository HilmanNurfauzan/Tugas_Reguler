<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button onclick="increaseCounter()">Click me</button>
    <p id="count"></p>

    <p>Click the button to see the counter increase</p>
    <p>
      Close the browser tab (or window), and try again, and the counter is
      reset.
    </p>

    <script>
      let counter = localStorage.getItem("counter");

      if (counter == null) {
        counter = 0;
        localStorage.setItem("counter", counter);
      }

      function increaseCounter() {
        counter++;
        localStorage.setItem("counter", counter);
        document.getElementById("count").innerText ="You have clicked the button " 
        + counter +
        " times(s) in this session.";
      }
    </script>
  </body>
</html>
