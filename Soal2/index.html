<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Soal Kedua</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Soal Pertama :)</h1>
      </div>
      <div class="content">
        <div class="form-section">
          <h2>Formulir Entah Apa</h2>
          <form>
            <div class="form-row">
              <div class="col-left">
                <label for="username">Username</label>
              </div>
              <div class="col-right">
                <input type="text" id="username" placeholder="Username" />
              </div>
            </div>
            <div class="form-row">
              <div class="col-left">
                <label for="password">Password</label>
              </div>
              <div class="col-right">
                <input type="password" id="password" placeholder="Password" />
              </div>
            </div>

            <div class="form-row">
              <div class="col-left">
                <label for="vercode">Verification Code</label>
              </div>
              <div class="col-right">
                <input type="text" id="vercode" placeholder="Isi kode anda" />
              </div>
            </div>

            <div class="form-row remember-row">
              <label class="checkbox-label">
                <input type="checkbox" /> Remember Me
              </label>
            </div>

            <div class="form-row submit-row">
              <button type="submit">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
